<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: Georgia, 'DejaVu Serif', 'Liberation Serif', serif; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A1B14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0A1B14; }
      #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; filter: saturate(0.85); }
      #world > svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .abs { position: absolute; }
      .band { position: absolute; border-radius: 50%; mix-blend-mode: screen; opacity: 0; }
      .teal { background: radial-gradient(ellipse at center, rgba(107,181,185,.75) 0%, rgba(92,157,140,.35) 45%, rgba(92,157,140,0) 72%); }
      .rose { background: radial-gradient(ellipse at center, rgba(230,162,156,.75) 0%, rgba(212,130,107,.3) 45%, rgba(212,130,107,0) 72%); }
      .star { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #e9d08e; }
      .fog { position: absolute; width: 1500px; height: 380px; left: -210px; border-radius: 50%; opacity: 0.5;
        background: radial-gradient(ellipse at center, rgba(199,214,224,.8) 0%, rgba(199,214,224,0) 70%); }
      .stone { position: absolute; border-radius: 50%; opacity: 0;
        background: linear-gradient(#a9c8cf, #5a7f88 60%, #2B4F5C);
        box-shadow: 0 0 46px rgba(130,192,212,.85), 0 0 120px rgba(107,181,185,.45); }
      .ring { position: absolute; border-radius: 50%; border: 3px solid rgba(170,222,232,.9); opacity: 0; }
      #fig { position: absolute; left: 480px; top: 1390px; width: 120px; height: 260px; filter: drop-shadow(0 0 14px rgba(130,192,212,.75)); }
      .txt { position: absolute; left: 90px; width: 900px; text-align: center; font-size: 82px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em;
        color: #F4EEDD; text-shadow: 0 4px 30px rgba(10,27,20,.7); }
      .it { font-style: italic; font-weight: 400; font-size: 70px; }
      .w { display: inline-block; opacity: 0; }
      .mote { position: absolute; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, rgba(200,240,245,1) 0%, rgba(200,240,245,0) 70%); }
      #grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: url(grain.png); opacity: 0.17; }
      #vig { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
        background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(10,27,20,.55) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19" data-width="1080" data-height="1920">
      <div id="world">
        <svg viewBox="0 0 1080 1920">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0A1B14"/><stop offset="0.5" stop-color="#1F2E3A"/><stop offset="1" stop-color="#33526f"/>
            </linearGradient>
            <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2B4F5C"/><stop offset="0.35" stop-color="#1A3E45"/><stop offset="1" stop-color="#0A1B14"/>
            </linearGradient>
          </defs>
          <rect width="1080" height="980" fill="url(#sky)"/>
          <rect y="980" width="1080" height="940" fill="url(#water)"/>
          <path id="shore" d="" fill="#0A1B14" opacity="0"/>
          <g id="ripples" stroke="#82C0D4" stroke-opacity="0.12" fill="none" stroke-width="2">
            <ellipse cx="300" cy="1500" rx="240" ry="14"/><ellipse cx="800" cy="1350" rx="200" ry="11"/>
            <ellipse cx="180" cy="1240" rx="150" ry="8"/><ellipse cx="900" cy="1700" rx="260" ry="16"/>
          </g>
        </svg>
        <div id="stars" class="abs" style="left:0;top:0;"></div>
        <div id="aur" class="abs" style="left:0;top:0;width:1080px;height:1920px;"></div>
        <div id="aurR" class="abs" style="left:0;top:0;width:1080px;height:1920px;transform-origin:0 980px;transform:scaleY(-1);opacity:0.3;"></div>
        <div class="fog" id="fogA" style="top:850px"></div>
        <div class="fog" id="fogB" style="top:960px"></div>
        <div id="stones" class="abs" style="left:0;top:0;"></div>
        <div id="fig"><div id="figIn">
          <svg viewBox="0 0 120 260" width="120" height="260">
            <rect x="44" y="236" width="13" height="22" rx="6" fill="#2b2131"/><rect x="63" y="236" width="13" height="22" rx="6" fill="#2b2131"/>
            <rect x="53" y="50" width="14" height="22" rx="6" fill="#B08A6B"/>
            <path d="M60 64 C 40 64 28 72 26 92 L 22 152 C 20 180 16 212 10 242 C 40 249 80 249 110 242 C 104 212 100 180 98 152 L 94 92 C 92 72 80 64 60 64Z" fill="#C49E7C"/>
            <path d="M28 82 C 19 112 21 152 25 186 L 38 188 C 36 152 36 114 41 84Z" fill="#B08A6B"/>
            <path d="M92 82 C 101 112 99 152 95 186 L 82 188 C 84 152 84 114 79 84Z" fill="#B08A6B"/>
            <path d="M60 140 L 60 242" stroke="#B08A6B" stroke-width="2" opacity="0.6"/>
            <circle cx="60" cy="36" r="23" fill="#2D2D2D"/>
            <path id="pony" d="M72 24 C 100 18 108 50 90 78 C 96 56 90 42 74 38Z" fill="#2D2D2D"/>
          </svg>
        </div></div>
      </div>

      <div class="txt" id="t1" style="top:380px;">You don’t have to see<br>the whole path.</div>
      <div class="txt" id="m1" style="top:380px;">It’s not about knowing<br>where it leads.</div>
      <div class="txt" id="m2" style="top:380px;">It’s about trusting<br>the next step.</div>
      <div class="txt" id="m3" style="top:380px;">It’s not about<br>being certain.</div>
      <div class="txt" id="m4" style="top:380px;">It’s about<br>being willing.</div>
      <div class="txt it" id="t3" style="top:360px;">Stepping stones never ask<br>to see the shore.</div>
      <div class="txt" id="t4" style="top:380px;">You’re not lost.<br>You’re on your way.</div>

      <div id="motes"></div>
      <div id="vig"></div>
      <div id="grain"></div>
      <audio id="music" src="audio/music_bright.mp3" data-start="0" data-duration="19" data-volume="0.42" data-fade-in="0.8" data-fade-out="2.2"></audio>
      <audio id="vo_t1" src="audio/me_t1.wav" data-start="0.25" data-duration="3.84" data-volume="1"></audio>
      <audio id="vo_m1" src="audio/me_m1.wav" data-start="2.89" data-duration="4.1" data-volume="1"></audio>
      <audio id="vo_m2" src="audio/me_m2.wav" data-start="5.79" data-duration="4.1" data-volume="1"></audio>
      <audio id="vo_m3" src="audio/me_m3.wav" data-start="8.69" data-duration="3.24" data-volume="1"></audio>
      <audio id="vo_m4" src="audio/me_m4.wav" data-start="10.73" data-duration="3.1" data-volume="1"></audio>
      <audio id="vo_t3" src="audio/me_t3.wav" data-start="12.63" data-duration="4.74" data-volume="1"></audio>
      <audio id="vo_t4" src="audio/me_t4.wav" data-start="16.17" data-duration="2.83" data-volume="1" data-fade-out="0.4"></audio>
    </div>
    <script>
      // ---- build the world (deterministic) ----
      const $ = (id) => document.getElementById(id);
      const S = [];
      for (let i = 0; i < 60; i++) {
        const d = document.createElement("div");
        d.className = "star";
        d.style.left = ((i * 313) % 1060) + "px";
        d.style.top = ((i * 157) % 900) + "px";
        d.style.opacity = 0.3 + ((i * 7) % 6) / 10;
        $("stars").appendChild(d); S.push(d);
      }
      // aurora bands, plus mirrored reflection in the water
      const bandDefs = [
        { cls: "teal", l: -150, t: 300, w: 1100, h: 260, r: -10 },
        { cls: "teal", l: 150,  t: 520, w: 1100, h: 300, r: 6 },
        { cls: "teal", l: -250, t: 700, w: 1000, h: 240, r: -4 },
        { cls: "rose", l: 100,  t: 420, w: 1000, h: 280, r: -6 },
        { cls: "rose", l: -200, t: 640, w: 1100, h: 260, r: 8 }
      ];
      const B = [];
      ["aur", "aurR"].forEach((host) => bandDefs.forEach((b, i) => {
        const d = document.createElement("div");
        d.className = "band " + b.cls;
        d.style.cssText = `left:${b.l}px;top:${b.t}px;width:${b.w}px;height:${b.h}px;transform:rotate(${b.r}deg)`;
        $(host).appendChild(d); B.push({ el: d, cls: b.cls, i, host });
      }));
      // far shore treeline
      let p = "M0 982 L0 960";
      for (let x = 0; x <= 1080; x += 18) {
        const h = 22 + Math.round(Math.abs(Math.sin(x * 0.045)) * 34 + Math.abs(Math.sin(x * 0.13)) * 14);
        p += ` L${x} ${962 - h} L${x + 9} ${962 - h + 20} L${x + 18} 962`;
      }
      p += " L1080 982Z";
      $("shore").setAttribute("d", p);

      // stepping stones: perspective line from the viewer toward the far shore
      const P = [
        { x: 540, y: 1650, rx: 120 }, { x: 605, y: 1500, rx: 100 }, { x: 500, y: 1375, rx: 84 }, { x: 585, y: 1268, rx: 70 },
        { x: 520, y: 1180, rx: 58 },  { x: 568, y: 1108, rx: 48 },  { x: 538, y: 1050, rx: 40 }, { x: 552, y: 1005, rx: 34 }
      ];
      const ST = [], RG = [];
      P.forEach((q, i) => {
        const s = document.createElement("div");
        s.className = "stone";
        s.style.cssText = `left:${q.x - q.rx}px;top:${q.y - q.rx * 0.28}px;width:${q.rx * 2}px;height:${q.rx * 0.56}px`;
        $("stones").appendChild(s); ST.push(s);
        const r = document.createElement("div");
        r.className = "ring";
        r.style.cssText = `left:${q.x - q.rx}px;top:${q.y - q.rx * 0.28}px;width:${q.rx * 2}px;height:${q.rx * 0.56}px`;
        $("stones").appendChild(r); RG.push(r);
      });
      // drifting light motes
      const M = [];
      for (let i = 0; i < 22; i++) {
        const d = document.createElement("div");
        d.className = "mote";
        const sz = 9 + (i % 4) * 6;
        d.style.width = d.style.height = sz + "px";
        d.style.left = ((i * 211) % 1000) + 40 + "px";
        d.style.top = 1000 + ((i * 97) % 800) + "px";
        $("motes").appendChild(d); M.push(d);
      }
      // word-by-word text
      document.querySelectorAll(".txt").forEach((el) => {
        el.innerHTML = el.innerHTML.split("<br>").map((line) =>
          line.trim().split(/\s+/).map((w) => '<span class="w">' + w + "</span>").join(" ")).join("<br>");
      });
      const words = (sel) => Array.from(document.querySelectorAll(sel + " .w"));

      const tl = gsap.timeline({ paused: true });
      const V = {"t1": {"s": 0.25, "d": 2.44, "parts": [[8, 0.06, 2.34]]}, "m1": {"s": 2.89, "d": 2.7, "parts": [[4, 0.06, 1.4], [3, 1.85, 0.81]]}, "m2": {"s": 5.79, "d": 2.7, "parts": [[3, 0.06, 1.29], [3, 1.72, 0.94]]}, "m3": {"s": 8.69, "d": 1.84, "parts": [[5, 0.06, 1.74]]}, "m4": {"s": 10.73, "d": 1.7, "parts": [[4, 0.06, 1.6]]}, "t3": {"s": 12.63, "d": 3.34, "parts": [[4, 0.06, 2.0], [4, 2.38, 0.92]]}, "t4": {"s": 16.17, "d": 2.37, "parts": [[3, 0.06, 0.82], [4, 1.27, 1.06]]}};
      const reveal = (sel, t, gap) => words(sel).forEach((w, i) =>
        tl.fromTo(w, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, t + i * gap));
      const hide = (sel, t) => tl.to(sel + " .w", { opacity: 0, duration: 0.35, ease: "none" }, t);

      // slow camera: lean in during the walk, ease back for the finale
      tl.fromTo("#world", { scale: 1 }, { scale: 1.08, duration: V.t4.s - 0.4, ease: "none", transformOrigin: "50% 72%" }, 0);
      tl.to("#world", { scale: 1, duration: 19 - (V.t4.s - 0.4), ease: "sine.inOut", transformOrigin: "50% 72%" }, V.t4.s - 0.4);

      // ---- sky and water life ----
      S.forEach((d, i) => tl.to(d, { opacity: 0.12, duration: 1.2 + (i % 3) * 0.4, yoyo: true, repeat: 6, ease: "sine.inOut" }, (i % 6) * 0.3));
      tl.fromTo("#fogA", { x: -90 }, { x: 90, duration: 19, ease: "none" }, 0);
      tl.fromTo("#fogB", { x: 90 }, { x: -90, duration: 19, ease: "none" }, 0);
      tl.to("#fogA", { opacity: 0.12, duration: 2.5, ease: "none" }, V.t3.s - 0.6);
      tl.to("#fogB", { opacity: 0.16, duration: 2.5, ease: "none" }, V.t3.s - 0.6);
      tl.to("#shore", { opacity: 1, duration: 2.2, ease: "none" }, V.t3.s - 0.2);
      B.forEach((b) => {
        const mirror = b.host === "aurR";
        const tealIn = 3 + b.i * 2.2;
        if (b.cls === "teal") tl.fromTo(b.el, { opacity: 0 }, { opacity: 0.55, duration: 3, ease: "none" }, tealIn);
        else tl.fromTo(b.el, { opacity: 0 }, { opacity: 0.6, duration: 2.6, ease: "none" }, V.t4.s - 0.4);
        tl.fromTo(b.el, { x: b.i % 2 ? -50 : 50 }, { x: b.i % 2 ? 50 : -50, duration: 19, ease: "none" }, 0);
      });

      // ---- the walk: each stone lights up only as the step is taken ----
      const stepAt = [0, V.m1.s + 0.2, V.m2.s + 0.2, V.m3.s + 0.2, V.m4.s + 0.2, V.t3.s + 0.4, V.t3.s + 1.8, V.t4.s - 0.9];
      tl.fromTo(ST[0], { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0.3);
      ST.forEach((s, k) => {
        if (k > 0) tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, stepAt[k] - 1.0);
        const left = (stepAt[k + 1] || V.t4.s + 0.4) + 0.6;
        tl.to(s, { opacity: 0.55, duration: 0.9, ease: "none" }, left);
        const rt = k === 0 ? 0.5 : stepAt[k] - 1.0;
        tl.fromTo(RG[k], { opacity: 0.9, scale: 0.55 }, { opacity: 0, scale: 2.3, duration: 1.7, ease: "power1.out" }, rt);
        if (k > 0) tl.fromTo(RG[k], { opacity: 0.8, scale: 0.55 }, { opacity: 0, scale: 2.0, duration: 1.4, ease: "power1.out" }, stepAt[k] + 0.9);
      });
      P.forEach((q, k) => {
        if (k === 0) return;
        tl.to("#fig", { x: q.x - P[0].x, y: q.y - P[0].y, scale: q.rx / P[0].rx, duration: 1.0, ease: "power2.inOut", transformOrigin: "50% 100%" }, stepAt[k]);
        tl.fromTo("#figIn", { y: 0 }, { y: -9, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, stepAt[k]);
      });

      tl.fromTo("#figIn", { rotation: -1.4 }, { rotation: 1.4, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 14, transformOrigin: "50% 100%" }, 0);

      tl.fromTo("#pony", { rotation: -5 }, { rotation: 6, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 17, transformOrigin: "72px 30px" }, 0);

      // ---- the words (timed to the voiceover) ----
      const Rp = (id) => {
        const ws = words("#" + id); let wi = 0;
        V[id].parts.forEach(([n, rs, pd]) => {
          for (let i = 0; i < n; i++) {
            const w = ws[wi++]; if (!w) break;
            tl.fromTo(w, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, Math.max(0, V[id].s + rs + (i * pd) / n - 0.1));
          }
        });
        if (id !== "t4") hide("#" + id, V[id].s + V[id].d - 0.2);
      };
      ["t1", "m1", "m2", "m3", "m4", "t3", "t4"].forEach(Rp);

      // ---- light motes rise as hope builds; gentle heartbeat in the edges ----
      M.forEach((m, i) => {
        const t0 = 7.0 + (i % 8) * 1.05;
        tl.fromTo(m, { y: 0, opacity: 0 }, { y: -520 - (i % 5) * 70, opacity: 0.8, duration: 3.0, ease: "sine.out" }, t0);
        tl.to(m, { opacity: 0, duration: 1.0, ease: "none" }, t0 + 2.0);
      });
      tl.fromTo("#vig", { opacity: 1 }, { opacity: 0.8, duration: 0.8, yoyo: true, repeat: 22, ease: "sine.inOut" }, 0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
